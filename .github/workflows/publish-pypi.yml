name: Publish mapselect to PyPI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the sdist and wheel of package/
        run: |
          python -m pip install --upgrade build twine
          python -m build package
          python -m twine check package/dist/*
      - name: Test the built wheel
        run: |
          python -m pip install package/dist/*.whl
          python package/tests/test_mapselect.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: package/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
